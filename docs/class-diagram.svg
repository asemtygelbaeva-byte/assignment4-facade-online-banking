<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <style>
    .box { fill: #f7f8fb; stroke: #26364a; stroke-width: 2; }
    .facade { fill: #e8f1ff; stroke: #1c5b9b; stroke-width: 2; }
    .title { font: bold 18px Arial, sans-serif; fill: #172333; }
    .text { font: 14px Arial, sans-serif; fill: #26364a; }
    .line { stroke: #52657a; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .dash { stroke-dasharray: 8 6; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 z" fill="#52657a" />
    </marker>
  </defs>
  <text x="40" y="42" class="title">Assignment 4 Telemedicine Facade — Topic 19</text>
  <rect x="40" y="85" width="190" height="95" rx="10" class="box" />
  <text x="60" y="118" class="title">Client</text>
  <text x="60" y="145" class="text">Telemedicine CLI</text>
  <text x="60" y="166" class="text">one booking call</text>

  <rect x="300" y="70" width="250" height="130" rx="10" class="facade" />
  <text x="325" y="105" class="title">Telemedicine Facade</text>
  <text x="325" y="133" class="text">book A -&gt; B -&gt; C</text>
  <text x="325" y="156" class="text">persist progress</text>
  <text x="325" y="179" class="text">compensate on failure</text>

  <rect x="670" y="30" width="230" height="135" rx="10" class="box" />
  <text x="695" y="65" class="title">Subsystem A</text>
  <text x="695" y="92" class="text">Appointment Scheduler</text>
  <text x="695" y="115" class="text">Patient Record</text>
  <text x="695" y="138" class="text">Patient Record Store</text>

  <rect x="670" y="205" width="230" height="135" rx="10" class="box" />
  <text x="695" y="240" class="title">Subsystem B</text>
  <text x="695" y="267" class="text">Video Call Manager</text>
  <text x="695" y="290" class="text">Session Notes</text>
  <text x="695" y="313" class="text">Session Notes Store</text>

  <rect x="670" y="380" width="230" height="135" rx="10" class="box" />
  <text x="695" y="415" class="title">Subsystem C</text>
  <text x="695" y="442" class="text">E-Prescription Service</text>
  <text x="695" y="465" class="text">Billing</text>
  <text x="695" y="488" class="text">Billing Store</text>

  <rect x="300" y="300" width="250" height="115" rx="10" class="facade" />
  <text x="325" y="335" class="title">OperationsFacade</text>
  <text x="325" y="363" class="text">inspect persisted state</text>
  <text x="325" y="386" class="text">manual compensation</text>

  <rect x="300" y="500" width="250" height="100" rx="10" class="box" />
  <text x="325" y="535" class="title">ChainStore</text>
  <text x="325" y="563" class="text">chain.csv</text>
  <text x="325" y="586" class="text">PENDING / COMPLETED / COMPENSATED</text>

  <path d="M230 132 L300 132" class="line" />
  <path d="M550 105 L670 98" class="line" />
  <path d="M550 135 L670 272" class="line" />
  <path d="M550 165 L670 447" class="line" />
  <path d="M550 560 L670 100" class="line dash" />
  <path d="M550 560 L670 275" class="line dash" />
  <path d="M425 300 L425 200" class="line" />
  <path d="M425 415 L425 500" class="line" />
</svg>
